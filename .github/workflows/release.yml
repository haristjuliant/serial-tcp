name: Release

# Tag a commit `v0.2.0` and push it, and the binaries below appear on the
# release. macOS is the reason this exists: those builds cannot be
# cross-compiled from Windows or Linux, so CI is the only practical way to
# produce them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # `macos-13` retired in December 2025 and its jobs now queue forever
          # waiting for a runner that will never arrive; `macos-15-intel` is the
          # replacement label for building x86_64 on real Intel hardware.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # Native arm64 rather than a cross-compile, which also keeps libudev
          # available so `list` works. For Raspberry Pi and similar.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz

          # Statically linked, so it runs on any glibc vintage. Drops libudev,
          # which means `list` finds nothing — `serve`, `connect` and the
          # dashboard are unaffected.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            features: --no-default-features
            suffix: -static

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="serial-tcp-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}"
          staging="dist/$name"
          mkdir -p "$staging"
          cp README.md "$staging/"
          if [ -f LICENSE ]; then cp LICENSE "$staging/"; fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/serial-tcp.exe" "$staging/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/serial-tcp" "$staging/"
            (cd dist && tar czf "$name.tar.gz" "$name")
            echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # Only a hand-off to the publish job below; the release itself is where
      # these end up permanently, so there is no reason to keep the copies for
      # the default ninety days.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}${{ matrix.suffix }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # So a download can be checked against something, rather than trusted
      # because it came from the right-looking URL.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            Pick the build for your machine, unpack it, and run it — there is
            nothing to install and no runtime to set up.

            | Platform | File |
            |---|---|
            | Windows (x64) | `…x86_64-pc-windows-msvc.zip` |
            | macOS (Apple Silicon) | `…aarch64-apple-darwin.tar.gz` |
            | macOS (Intel) | `…x86_64-apple-darwin.tar.gz` |
            | Linux (x64) | `…x86_64-unknown-linux-gnu.tar.gz` |
            | Linux (ARM64) | `…aarch64-unknown-linux-gnu.tar.gz` |
            | Linux (x64, static) | `…x86_64-unknown-linux-musl-static.tar.gz` |

            The ARM64 build is the one for a Raspberry Pi or similar board. The
            static x64 build needs no system libraries, at the cost of `list`
            finding no ports.

            The macOS builds are not signed, so Gatekeeper will refuse them the
            first time. Clear the quarantine flag once:

            ```sh
            xattr -d com.apple.quarantine ./serial-tcp
            ```

            Verify a download against `SHA256SUMS` before running it.
